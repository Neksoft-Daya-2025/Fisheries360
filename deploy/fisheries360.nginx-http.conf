# Only this domain is routed to the isolated Fisheries360 process.
server {
    listen 80;
    listen [::]:80;
    server_name fisheries360.com www.fisheries360.com;
    access_log /var/log/nginx/fisheries360.access.log;
    error_log /var/log/nginx/fisheries360.error.log;
    client_max_body_size 10m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/fisheries360/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
